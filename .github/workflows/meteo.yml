name: Aggiorna meteo (meteo.it + iLMeteo)

on:
  schedule:
    - cron: "7 * * * *"      # ogni ora (UTC), al minuto 7
  workflow_dispatch:         # avvio manuale dalla tab Actions

permissions:
  contents: write

concurrency:
  group: meteo
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica le previsioni
        run: python scripts/scrape_meteo.py
        continue-on-error: true   # se un sito è giù, salva comunque l'altro

      - name: Salva nel repo
        run: |
          git config user.name "meteo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then echo "nessuna novità"; exit 0; fi
          git commit -m "meteo: aggiornamento $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
