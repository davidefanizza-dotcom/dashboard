<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D9BFF"/>
      <stop offset="1" stop-color="#0056D6"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE8F8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF3B0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFF3B0" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#00327A" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- squircle iOS -->
  <path d="M256 0C60 0 0 60 0 256s60 256 256 256 256-60 256-256S452 0 256 0z" fill="url(#bg)"/>
  <path d="M256 0C60 0 0 60 0 256c0 20 .6 39 2 56C40 120 120 40 312 2 294 .6 275 0 256 0z" fill="#fff" opacity=".12"/>
  <!-- sole -->
  <circle cx="320" cy="190" r="150" fill="url(#glow)"/>
  <circle cx="320" cy="190" r="78" fill="url(#sun)"/>
  <g stroke="url(#sun)" stroke-width="16" stroke-linecap="round">
    <line x1="320" y1="70" x2="320" y2="92"/>
    <line x1="440" y1="190" x2="418" y2="190"/>
    <line x1="405" y1="105" x2="389" y2="121"/>
    <line x1="235" y1="105" x2="251" y2="121"/>
    <line x1="405" y1="275" x2="389" y2="259"/>
  </g>
  <!-- nuvola -->
  <g filter="url(#sh)">
    <path d="M150 400h190a62 62 0 0 0 6-123.7A86 86 0 0 0 182 230a52 52 0 0 0-32 170z" fill="url(#cloud)"/>
  </g>
</svg>
